# Vorgefertigte Helden für „Die Finsterwacht“. tools/helden.py prüft die Werte gegen die
# Erschaffungsregeln der Core Rules und setzt daraus die Heldenbögen (build/helden.tex).
#
# Felder je Held:
#   id, name, zeile (Unterzeile auf dem Bogen), alter, kultur, berufung (Calling)
#   basis              nur bei Hausregel-Kulturen: die Kultur der Core Rules, deren Werte gelten
#   tausch             Hausregel: Paare von Skills, die ihre Kulturwerte tauschen
#   attribute          Strength, Heart, Wits (eine Zeile der Kulturtabelle)
#   kings_of_men       Rangers: welches Attribut +1 bekommt
#   favoured_kultur    der favorisierte Skill der Kultur; favoured_berufung: zwei aus dem Calling
#   kampf              Combat Proficiencies der Kultur (eine auf 2, eine andere auf 1)
#   erfahrung          Previous Experience: je Eintrag +1 auf den Skill (Kosten = neuer Rang, zusammen 10)
#   merkmale           zwei Distinctive Features der Kultur (das dritte kommt vom Calling)
#   tugend, prowess    Virtue (Prowess: auf welches Attribut)
#   belohnung          Reward: { art, gegenstand }
#   ausruestung        Waffen, Rüstung, Helm, Schild (Namen wie in den Core Rules)
#   nuetzlich          Useful Items: { name, skill }
#   kurz               kurzer Hintergrund für den Bogen (*kursiv*, **fett**)

gruppe = "Vorgefertigte Helden"
tn_basis = 18   # TN = 18 − Attribut (Option der Core Rules für kurze Spiele); 20 für die Grundregel
patron = "Lady Gilraen"   # Patron aller Helden (Feld auf dem Bogen)

[[helden]]
id = "golasdir"
name = "Golasdir"
zeile = "Dúnadan des Nordens · aus den verborgenen Siedlungen im Angle"
alter = "38"
kultur = "Rangers of the North"
berufung = "Captain"
attribute = { Strength = 6, Heart = 5, Wits = 3 }
kings_of_men = "Heart"
favoured_kultur = "Lore"
favoured_berufung = ["Battle", "Enhearten"]
kampf = { Swords = 2, Bows = 1 }
erfahrung = ["Enhearten", "Enhearten", "Battle", "Song", "Lore"]
merkmale = ["Stern", "True-hearted"]
tugend = "Hardiness"
belohnung = { art = "Grievous", gegenstand = "Long sword" }
ausruestung = ["Long sword", "Bow", "Leather corslet"]
nuetzlich = [{ name = "Liederbuch deiner Großmutter", skill = "Song" }]
kurz = """Du reitest seit zehn Jahren mit Halbarads Rangers und sollst die Fremden zu Lady Gilraen bringen. Deine Großmutter hat dir die alten Lieder deines Volkes beigebracht, auch das von der Wacht im Norden. Dein junger Vetter **Rhovan** reitet in derselben Schar; du hast versprochen, auf ihn aufzupassen."""

