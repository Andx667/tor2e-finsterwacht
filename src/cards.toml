# Gegenstandskarten (Anhang). Eine Karte pro physischem Exemplar, Reihenfolge = `order`.
# Regelbegriffe aus `terms` werden auf den Karten automatisch kursiv gesetzt.

hint = "Zum Ausschneiden, im Pokerkartenformat (63 × 88 mm) · Klinge, Dolch, Bogen und Panzerhemd je zweimal, Tirnaur, Torhüter, Breschenwacht und Horn je einmal"
footer = "Gabe der Wacht: wirkt erst, wenn sie erwacht."
order = ["tirnaur", "schild", "horn", "axt", "klinge", "klinge", "dolch", "dolch", "bogen", "bogen", "hemd", "hemd"]

terms = [
  "Shadow weakness", "Eye Awareness", "Peril rating", "Success die", "Feat die", "Piercing Blow",
  "Famous Weapon", "Famous Armour", "Marvellous Artefact", "Core Rules", "Close-fitting",
  "Cunning Make", "Long-hafted axe", "Long sword", "Short sword", "Coat of mail", "Undertaking",
  "Blessings", "Blessing", "Banes", "Bane", "Keen", "Fell", "Grievous", "Reinforced", "Damage",
  "Injury", "Load", "Protection", "Parry", "Hope", "Shadow", "Awe", "Battle", "Sword", "Bow", "Shield",
]

[cards.tirnaur]
name = "Tirnaur, das Schwert des Hauptmanns"
kind = "Famous Weapon · Long sword · númenórische Arbeit"
stats = "Damage 5 · Injury 16 (zweihändig 18) · Load 3"
stats_note = "ein- oder zweihändig"
text = "Thorondirs eigene Klinge, älter als die Festung, aus Númenor mitgebracht. Die Runen auf dem Stahl nennen ihren Namen: Tirnaur, „Wachfeuer“."
effects = [
  ["Sofort", "Keen (Piercing Blow schon bei 9 auf dem Feat die)"],
  ["Gabe der Wacht", "Fell (Injury +2); Bane: Orks"],
  ["Besonderheit", "Leuchtet schwach, wenn Orks im Umkreis einer Meile sind."],
]

[cards.schild]
name = "Der Torhüter"
kind = "Famous Armour · Shield · númenórische Arbeit"
