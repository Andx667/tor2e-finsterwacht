stats_note = "vor Reinforced und Cunning Make"
text = "Der Schild des Torwächters, in númenórischer Kunst geschmiedet und mit Turm und Stern bemalt. Sein Rand ist von hundert Orkklingen zerkerbt, doch er ist nie gesplittert."
