# Gegenstandskarten (Anhang). Eine Karte pro physischem Exemplar, Reihenfolge = `order`.
#
# Die Gegenstände stehen im Format von tor2e-items (Schatzkammer): Werte, Eigenschaften (`qualities`)
# und Regeltexte kommen aus src/rules.toml, tools/check.py prüft sie. Beide Dateien sind von dort
# übernommen. Die Felder sind in tor2e-items/src/cards.toml beschrieben.
#
# Nur für die Finsterwacht:
#   order      die Karten in Druckreihenfolge, ein Eintrag je Exemplar
#   immediate  die einfachen Rewards: auf der Karte der Eintrag ohne Kennwort. Alles andere (bessere
#              Rewards, Banes, Blessings) ist die „Gabe der Wacht“; freie `effects` stehen ohne Kennwort.
# Regelbegriffe aus `terms` werden auf den Karten automatisch kursiv gesetzt, dazu die Namen der
# Eigenschaften und die Gegenstandsarten aus src/rules.toml.

hint = "Zum Ausschneiden, im Pokerkartenformat (63,5 × 88,9 mm) · Klinge, Kurzschwert, Bogen und Kettenhemd je zweimal, Narcrist, Torhüter, Breschenwacht und Horn je einmal"
footer = "Gabe der Wacht: wirkt sofort – verwirkt, wenn die Toten entehrt wurden."
order = [
  "narcrist", "torhueter", "horn-der-finsterwacht", "breschenwacht",
  "klinge-der-wacht", "klinge-der-wacht", "kurzschwert-der-wacht", "kurzschwert-der-wacht",
  "bogen-der-wacht", "bogen-der-wacht", "kettenhemd-der-wacht", "kettenhemd-der-wacht",
]
immediate = ["Keen", "Fell", "Grievous", "Reinforced", "Close-fitting", "Cunning Make"]

terms = [
  "Shadow weakness", "Eye Awareness", "Peril rating", "Success die", "Feat die", "Piercing Blow",
  "Core Rules", "Long-hafted axe", "Long sword", "Short sword", "Coat of mail", "Undertaking",
  "Magical success", "Blessings", "Blessing", "Banes", "Bane", "Damage", "Injury", "Load", "Protection", "Parry",
  "Hope", "Hate", "Shadow", "Awe", "Battle", "Valour", "Sword", "Bow", "Shield",
]

